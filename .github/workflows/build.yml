name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-24.04
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev xvfb

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ runner.os == 'macOS' && '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"' || '' }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        if: runner.os == 'Linux'
        run: xvfb-run -a build/Forge808Tests_artefacts/Release/Forge808Tests test-output

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: Mahogany808-${{ matrix.name }}
          path: |
            build/Forge808_artefacts/Release/VST3
            build/Forge808_artefacts/Release/Standalone

      # Zipped on the runner so macOS/Linux executable permissions survive the download.
      - name: Package release zip
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: build/Forge808_artefacts/Release
        run: cmake -E tar cf "${{ github.workspace }}/Mahogany808-${{ matrix.name }}.zip" --format=zip VST3 Standalone

      - name: Upload release zip
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: Mahogany808-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: Mahogany808-*.zip
          generate_release_notes: true
